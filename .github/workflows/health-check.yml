name: Scheduled Health Check

on:
  schedule:
    - cron: '0 */12 * * *'
    
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest

    steps:
      - name: Pull latest Docker image
        run: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/enterprise-app:latest
      
      - name: Run Container
        run: |
          docker run -d -p 5000:5000 --name enterprise-cicd ${{ secrets.DOCKER_USERNAME }}/enterprise-app:latest

      - name: Wait for Application
        run: sleep 5

      - name: Perform Health check
        run: |
          response=$(curl -s http://localhost:5000/health)

          echo "Response: $response"

          if [[ $response == *"healthy"* ]]; then
            echo "Health check PASSED"
          else
            echo "Health check FAILED"
            exit 1
          fi

      - name: Generate Workflow Summary
        run: |
          echo "## Health Check Report" >> $GITHUB_STEP_SUMMARY
          echo "- Image: ${{ secrets.DOCKER_USERNAME }}/enterprise-app:latest" >> $GITHUB_STEP_SUMMARY
          echo "- Status: PASSED" >> $GITHUB_STEP_SUMMARY
          echo "- Time: $(date)" >> $GITHUB_STEP_SUMMARY

      - name: Stop Container
        run: |
          docker stop enterprise-cicd
          docker rm enterprise-cicd
