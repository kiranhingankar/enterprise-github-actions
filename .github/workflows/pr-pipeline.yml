name: PR pipeline

on:
  pull_request:
    branches:
      - main

    types:
      - opened
      - synchronize

permissions:
  contents: read
  pull-requests: write

jobs:
  build-test:
    uses: ./.github/workflows/reusable-build-test.yml
    with:
      python_version: 3.11
      run_tests: true
    
  dependency-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Dependencies for Vulnerabilities
        uses: actions/dependency-review-action@v4

        with:
          fail-on-severity: critical 
          
  pr_comment:
    runs-on: ubuntu-latest

    needs: build-test

    steps:
      - name: Print PR Summary
        run: |
          echo "PR check passed for branch: ${{ github.head_ref }}"
          


