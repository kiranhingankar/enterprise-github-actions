name: Main Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-test:
    uses: ./.github/workflows/reusable-build-test.yml

    with:
      python_version: 3.11
      run_tests: true

  docker-build:
    needs: build-test

    uses: ./.github/workflows/reusable-docker.yml

    with:
      image_name: enterprise-app
      tag: sha-${{ github.sha }}

    secrets:
      docker_username: ${{ secrets.DOCKER_USERNAME }}
      docker_token: ${{ secrets.DOCKER_TOKEN }}
    
  deploy:
      runs-on: ubuntu-latest

      needs: docker-build

      environment:
        name: production

      steps:
        - name: Deploy
          run: |
            echo "Deploying image: ${{ needs.docker-build.outputs.image_url }} to production"
