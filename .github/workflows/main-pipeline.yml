name: Main Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test:
    uses: ./.github/workflows/reusable-build-test.yml

    with:
      python_version: 3.11
      run_tests: true

  docker-build:
    needs: build-test

    uses: ./.github/workflows/reusable-docker.yml

    with:
      image_name: enterprise-app
      tag: sha-${{ github.sha }}

    secrets:
      docker_username: ${{ secrets.DOCKER_USERNAME }}
      docker_token: ${{ secrets.DOCKER_TOKEN }}
    
  security-scan:
    needs: docker-build

    runs-on: ubuntu-latest

    steps:
      - name: Scan Docker Image for Vulnerabilities
        uses: aquasecurity/trivy-action@master

        with:
          image-ref: '${{ secrets.DOCKER_USERNAME }}/enterprise-app:latest'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'
  
  deploy:
      runs-on: ubuntu-latest

      needs:
        - docker-build
        - security-scan

      environment:
        name: production

      steps:
        - name: Deploy
          run: |
            echo "Deploying image:" 
            echo "${{ needs.docker-build.outputs.image_url }}"
            echo "to production"
